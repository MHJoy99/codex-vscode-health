name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          docker run --rm -v "${{ github.workspace }}:/mnt" -w /mnt koalaman/shellcheck:stable bin/vscode-health.sh

  bash-n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax check
        run: bash -n bin/vscode-health.sh

  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run health gate (allow warning 1, fail on crit 2)
        run: |
          chmod +x bin/vscode-health.sh
          set +e
          bash bin/vscode-health.sh 2>&1 | tee vscode-health.log
          rc="${PIPESTATUS[0]}"
          echo "exit=$rc"
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 1 ]; then exit 0; fi
          exit "$rc"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vscode-health-logs
          path: vscode-health.log
          retention-days: 7
